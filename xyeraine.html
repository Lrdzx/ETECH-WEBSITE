<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Interactive</title>
  <style>
    /* ===== Reset & Global ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
      background-size: 800% 800%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Overlay ===== */
    .overlay {
      position: absolute;
      inset: 0;
    }

    /* ===== Floating Images ===== */
    .floating-image {
      position: absolute;
      bottom: -350px;
      opacity: 0;
      pointer-events: none;
      animation: rise linear forwards;
    } 
    
    .floating-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-130vh); opacity: 0; }
    }

    /* ===== Card ===== */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(25px);
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 2rem;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.5rem;
    }

    /* ===== Buttons ===== */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      position: relative;
      height: 60px;
    }
    button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(236,72,153,0.5);
    }
    #yesBtn {
      background: #ec4899;
      color: #fff;
    }
    #noBtn { background: #9ca3af; color: #fff;}

    /* ===== Spotify Card ===== */
    .valentine-gif {
  width: 200px;      /* adjust as needed */
  height: 200px;
  border-radius: 1rem;
  object-fit: cover;
  margin-bottom: 1rem; /* spacing above the question */
}

    /* ===== Music Player ===== */
.player {
  background: #121212;
  color: white;
  width: 90vw;
  max-width: 320px;
  box-sizing: border-box;   /* 🔥 THIS FIXES OVERFLOW */
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  gap: 15px;
  position: relative;
  z-index: 10;              /* 🔥 keeps it above floating images */
}

.player-header {
  font-size: 0.8rem;
  text-transform: uppercase;
  opacity: 0.6;
}

.album-art {
  width: 100%;
  border-radius: 15px;
}

.song-title {
  font-weight: bold;
  font-size: 1.1rem;
}

.song-artist {
  font-size: 0.9rem;
  opacity: 0.6;
}

.progress-container {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
}

.progress-bar {
  flex: 1;
  height: 5px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
  cursor: pointer;
}

.progress {
  background: #1db954;
  height: 100%;
  width: 0%;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

.controls button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s;
}

.controls button:hover {
  transform: scale(1.2);
}

.play-btn {
  background: white;
  color: black;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.volume {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
}

.volume input {
  flex: 1;
}
    /* ===== Floating Hearts ===== */
    .heart {
      position: absolute;
      width: 15px;
      height: 15px;
      background: red;
      transform: rotate(-45deg);
      animation: floatUp 3s ease forwards;
      pointer-events: none;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
    }
    .heart::before { top: -7px; left: 0; }
    .heart::after { left: 7px; top: 0; }
    @keyframes floatUp {
      0% { opacity:1; transform: translateY(0) rotate(-45deg); }
      100% { opacity:0; transform: translateY(-200px) rotate(-45deg); }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="floating-container" id="floatingContainer"></div>

  <!-- Question Card -->
  <div class="card" id="questionCard">
    <img src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" 
     alt="Valentine GIF" 
     class="valentine-gif">
    <h1>Will you be my Valentine?</h1>
    <p id="dynamicMessage">💕</p>
    <div class="buttons">
      <button id="yesBtn">Yes! 💖</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- Music Player -->
  <div class="player" id="musicPlayer" style="display:none;">
  <div class="player-header">Now Playing</div>

  <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop" 
       alt="Album" 
       class="album-art">

  <div class="song-info">
    <div class="song-title">Fast Food Pop</div>
    <div class="song-artist">Restaurant</div>
  </div>

  <div class="progress-container">
    <span id="currentTime">0:00</span>
    <div class="progress-bar" id="progressBar">
      <div class="progress" id="progress"></div>
    </div>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
  <button id="prevBtn">⏮</button>

  <button id="playPauseBtn" class="play-btn">▶</button>

  <button id="nextBtn">⏭</button>
</div>

  <div class="volume">
    🔊
    <input type="range" min="0" max="1" step="0.01" id="volume" value="0.7">
  </div>
</div>

  <!-- Audio Elements -->
  <audio id="teleportAudio" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>
  <audio id="yesAudio" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>
  <audio id="musicAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

  <!-- Script -->
  <script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const questionCard = document.getElementById('questionCard');
const musicPlayer = document.getElementById('musicPlayer');

const playPauseBtn = document.getElementById('playPauseBtn');
const musicAudio = document.getElementById('musicAudio');
const volumeSlider = document.getElementById('volume');
const progressBar = document.getElementById('progressBar');
const progress = document.getElementById('progress');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');

const floatingContainer = document.getElementById("floatingContainer");

let isPlaying = false;
let floatingInterval = null;

/* =========================
   PLAY / PAUSE
=========================*/
playPauseBtn.addEventListener('click', () => {
  if (isPlaying) {
    musicAudio.pause();
    playPauseBtn.textContent = "▶";
  } else {
    musicAudio.play();
    playPauseBtn.textContent = "❚❚";
  }
  isPlaying = !isPlaying;
});

/* =========================
   VOLUME
=========================*/
volumeSlider.addEventListener('input', () => {
  musicAudio.volume = volumeSlider.value;
});

/* =========================
   UPDATE TIME + PROGRESS
=========================*/
musicAudio.addEventListener('timeupdate', () => {
  if (musicAudio.duration) {
    const percent = (musicAudio.currentTime / musicAudio.duration) * 100;
    progress.style.width = percent + "%";

    currentTimeEl.textContent = formatTime(musicAudio.currentTime);
    durationEl.textContent = formatTime(musicAudio.duration);
  }
});

/* =========================
   SEEK
=========================*/
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const width = rect.width;
  const duration = musicAudio.duration;

  if (duration) {
    musicAudio.currentTime = (clickX / width) * duration;
  }
});

/* =========================
   FORMAT TIME
=========================*/
function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60)
    .toString()
    .padStart(2, '0');
  return `${mins}:${secs}`;
}

/* =========================
   YES BUTTON
=========================*/
yesBtn.addEventListener('click', () => {
  questionCard.style.display = 'none';
  musicPlayer.style.display = 'flex';

  musicAudio.currentTime = 0;

  musicAudio.play().then(() => {
    isPlaying = true;
    playPauseBtn.textContent = "❚❚";
  }).catch(err => {
    console.log("Autoplay blocked:", err);
  });

  if (!floatingInterval) {
    floatingInterval = setInterval(spawnImage, 600);
  }
});

/* =========================
   NO BUTTON DODGE
=========================*/
const moveDistance = 100; // how far the button moves
const padding = 20;       // distance from edges
let isAbsolute = false;   // tracks if button switched to absolute

document.addEventListener('mousemove', e => {
  const btnRect = noBtn.getBoundingClientRect();
  const mouseX = e.clientX;
  const mouseY = e.clientY;
  const btnCenterX = btnRect.left + btnRect.width / 2;
  const btnCenterY = btnRect.top + btnRect.height / 2;
  const distance = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

  if (distance < 100) {
    // Switch to absolute positioning when needed
    if (!isAbsolute) {
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${btnRect.left}px`;
      noBtn.style.top = `${btnRect.top}px`;
      isAbsolute = true;
    }

    // Calculate dodge direction away from cursor
    let dx = btnCenterX - mouseX;
    let dy = btnCenterY - mouseY;
    const mag = Math.hypot(dx, dy) || 1; // prevent divide by zero
    dx = (dx / mag) * moveDistance;
    dy = (dy / mag) * moveDistance;

    // New button position
    let newX = btnRect.left + dx;
    let newY = btnRect.top + dy;

    // Keep inside viewport
    newX = Math.max(padding, Math.min(newX, window.innerWidth - btnRect.width - padding));
    newY = Math.max(padding, Math.min(newY, window.innerHeight - btnRect.height - padding));

    noBtn.style.left = `${newX}px`;
    noBtn.style.top = `${newY}px`;
  }
});

/* =========================
   Keep inside viewport on resize
=========================*/
window.addEventListener('resize', () => {
  if (isAbsolute) {
    const btnRect = noBtn.getBoundingClientRect();
    const newX = Math.min(btnRect.left, window.innerWidth - btnRect.width - padding);
    const newY = Math.min(btnRect.top, window.innerHeight - btnRect.height - padding);
    noBtn.style.left = `${newX}px`;
    noBtn.style.top = `${newY}px`;
  }
});

/* =========================
   FLOATING IMAGES
=========================*/
const images = Array.from({ length: 20 }, (_, i) => `images/img${i + 1}.png`);

function spawnImage() {
  const img = document.createElement("img");
  img.src = images[Math.floor(Math.random() * images.length)];
  img.className = "floating-image";

  const maxLeft = window.innerWidth - 320;
  img.style.left = Math.random() * maxLeft + "px";

  const size = Math.random() * 140 + 180;
  img.style.width = size + "px";

  const tilt = Math.random() * 40 - 20;
  img.style.transform = `rotate(${tilt}deg)`;

  const duration = Math.random() * 4 + 6;
  img.style.animationDuration = duration + "s";

  floatingContainer.appendChild(img);

  setTimeout(() => img.remove(), duration * 1000);
}
</script>

</body>
</html>

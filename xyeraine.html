<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Interactive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
html,body{height:100%;width:100%;overflow:hidden}
.background-gif{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1}
body{display:flex;justify-content:center;align-items:center}
.overlay{position:absolute;inset:0}
.floating-image{position:absolute;bottom:-350px;opacity:0;pointer-events:none;animation:rise linear forwards;border-radius:20px}
.floating-container{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-130vh);opacity:0}}
.card{position:relative;z-index:10;background:rgba(255,255,255,0.15);backdrop-filter:blur(25px);border-radius:2rem;border:1px solid rgba(255,255,255,0.3);padding:2rem;text-align:center;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,0.3);transition:transform .3s}
.card:hover{transform:scale(1.03)}
h1{font-size:2.5rem;margin-bottom:.5rem;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
p{font-size:1.2rem;margin-bottom:1.5rem;min-height:1.5rem}
button{padding:1rem 2rem;border:none;border-radius:1.5rem;font-size:1.2rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3);transition:all .2s ease}
button:hover{transform:scale(1.1);box-shadow:0 10px 20px rgba(236,72,153,.5)}
#yesBtn,#noBtn{position:absolute;z-index:20}
#yesBtn{background:#ec4899;color:#fff}
#noBtn{background:#9ca3af;color:#fff}
.valentine-gif{width:200px;height:200px;border-radius:1rem;object-fit:cover;margin-bottom:1rem}
.player{background:#121212;color:#fff;width:90vw;max-width:320px;box-sizing:border-box;border-radius:20px;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:15px;position:relative;z-index:10}
.player-header{font-size:.8rem;text-transform:uppercase;opacity:.6}
.album-art{width:100%;border-radius:15px}
.song-title{font-weight:bold;font-size:1.1rem}
.song-artist{font-size:.9rem;opacity:.6}
.progress-container{display:flex;align-items:center;gap:8px;font-size:.75rem}
.progress-bar{flex:1;height:5px;background:#333;border-radius:5px;overflow:hidden;cursor:pointer}
.progress{background:#1db954;height:100%;width:0%}
.controls{display:flex;justify-content:center;align-items:center;gap:20px}
.controls button{background:none;border:none;color:white;font-size:18px;cursor:pointer;transition:transform .2s}
.controls button:hover{transform:scale(1.2)}
.play-btn{background:white;color:black;width:50px;height:50px;border-radius:50%;font-size:20px;display:flex;justify-content:center;align-items:center}
.volume{display:flex;align-items:center;gap:10px;font-size:.9rem}
.volume input{flex:1}
</style>
</head>
<body>

<div class="overlay"></div>
<div class="floating-container" id="floatingContainer"></div>

<div class="card" id="questionCard">
<img src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" class="valentine-gif">
<h1>Will you be my Valentine?</h1>
</div>

<button id="yesBtn">Yessss!</button>
<button id="noBtn">Nuh uh</button>

<div class="player" id="musicPlayer" style="display:none;">
<div class="player-header">Now Playing</div>
<img src="IMG_20260213_214708_409.jpg" class="album-art">
<div class="song-info">
<div class="song-title">I Love You So Much!</div>
<div class="song-artist">PandaUwU</div>
</div>
<div class="progress-container">
<span id="currentTime">0:00</span>
<div class="progress-bar" id="progressBar">
<div class="progress" id="progress"></div>
</div>
<span id="duration">0:00</span>
</div>
<div class="controls">
<button id="prevBtn">⏮</button>
<button id="playPauseBtn" class="play-btn">▶</button>
<button id="nextBtn">⏭</button>
</div>
<div class="volume">
🔊
<input type="range" min="0" max="1" step="0.01" id="volume" value="0.7">
</div>
</div>

<audio id="musicAudio" src="New_West_-_Those_Eyes_(mp3.pm).mp3" loop></audio>
<img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExa25icDUxdHJmM3Q1ZHp3aXluY2l3NjZvZzgxeTJzbnRna3RhdjI2MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lXOI5Bj5bndSw/giphy.gif" class="background-gif"/>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const questionCard = document.getElementById('questionCard');
  const musicPlayer = document.getElementById('musicPlayer');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const musicAudio = document.getElementById('musicAudio');
  const volumeSlider = document.getElementById('volume');
  const progressBar = document.getElementById('progressBar');
  const progress = document.getElementById('progress');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const floatingContainer = document.getElementById("floatingContainer");
  const valentineGifEl = document.querySelector(".valentine-gif");

  let isPlaying = false;
  let floatingInterval = null;

  const defaultGif = "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cmtlN2E5YXNkenRjbGw0NDlvOG1vbTcwdmNwY2NzNjg0MjBiOWg1MyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/U3TwCOuG8pipyr00nF/giphy.gif";
  const hoverGifs = [
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExejc0Z2cxY2ptdmlhYTZ4YnozMWlkZWI3ajhrYmwzcG0zZGNhajFoaSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/gyLFXmO7GIZ4Q/giphy.gif",
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnZjaTRuZGwweGpzNHI5bzA0ZHFmYTRpamx2aWFtcTBwMHN4NHJtbyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/txY42AvgOB0gS7L2Qg/giphy.gif",
    "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZzdrZHp4a3hzdjdsc3hjdGhna3JtZ2RzNTlwdHJ1d3QzbDh5Yzc1ZyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/8FGM6ZOuh2RKVcowa8/giphy.gif",
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTQyM28zaWNmdHp1MWl1MmF6ajNjY3ZzdjlzempzbTBta3d5ZXI4biZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/Xr9TlAqw3S7VPOrftK/giphy.gif",
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTQyM28zaWNmdHp1MWl1MmF6ajNjY3ZzdjlzempzbTBta3d5ZXI4biZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/Xr9TlAqw3S7VPOrftK/giphy.gif"
  ];

  const noMemeAudio = new Audio("https://www.myinstants.com/media/sounds/shocked-sound-effect.mp3");
  const yesMemeAudio = new Audio("https://www.myinstants.com/media/kids-saying-yay-sound-effect_xryiS4g.mp3");

  yesBtn.style.position = 'absolute';
  noBtn.style.position = 'absolute';
  yesBtn.style.zIndex = 20;
  noBtn.style.zIndex = 20;

  function positionButtonsBelowCard() {
    const cardRect = questionCard.getBoundingClientRect();
    const gapBetweenButtons = 20;
    const yesWidth = yesBtn.offsetWidth;
    const noWidth = noBtn.offsetWidth;
    const totalWidth = yesWidth + noWidth + gapBetweenButtons;
    const centerX = cardRect.left + (cardRect.width - totalWidth) / 2;
    const posY = cardRect.bottom + 20;

    yesBtn.style.left = centerX + "px";
    yesBtn.style.top = posY + "px";
    noBtn.style.left = (centerX + yesWidth + gapBetweenButtons) + "px";
    noBtn.style.top = posY + "px";
  }

  positionButtonsBelowCard();
  window.addEventListener('resize', positionButtonsBelowCard);

  yesBtn.addEventListener('click', () => {
    yesMemeAudio.currentTime = 0;
    yesMemeAudio.play().catch(() => {});

    questionCard.style.display = 'none';
    yesBtn.style.display = 'none';
    noBtn.style.display = 'none';
    musicPlayer.style.display = 'flex';
    musicAudio.currentTime = 0;

    musicAudio.play().then(() => {
      isPlaying = true;
      playPauseBtn.textContent = "❚❚";
    }).catch(err => console.log("Autoplay blocked:", err));

    if (!floatingInterval) {
      floatingInterval = setInterval(spawnImage, 600);
    }
  });

  const padding = 20;
  let noBtnPositions = [];
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  function generateNoPositions() {
    noBtnPositions = [];
    for (let i = 0; i < 20; i++) {
      const x = Math.random() * (window.innerWidth - btnWidth - padding*2) + padding;
      const y = Math.random() * (window.innerHeight - btnHeight - padding*2) + padding;
      noBtnPositions.push({x, y});
    }
  }

  generateNoPositions();

  let lastIndex = -1;
  noBtn.addEventListener('mouseenter', () => {
    let index;
    do {
      index = Math.floor(Math.random() * noBtnPositions.length);
    } while(index === lastIndex);

    lastIndex = index;
    const pos = noBtnPositions[index];

    noBtn.style.left = pos.x + "px";
    noBtn.style.top = pos.y + "px";

    noMemeAudio.currentTime = 0;
    noMemeAudio.play().catch(() => {});
  });

  document.addEventListener('mousemove', (e) => {
    const noRect = noBtn.getBoundingClientRect();
    const noCenterX = noRect.left + noRect.width / 2;
    const noCenterY = noRect.top + noRect.height / 2;
    const dist = Math.hypot(e.clientX - noCenterX, e.clientY - noCenterY);

    if (dist < 150) {
      valentineGifEl.src = hoverGifs[Math.floor(Math.random() * hoverGifs.length)];
    } else {
      valentineGifEl.src = defaultGif;
    }
  });

  window.addEventListener('resize', () => {
    generateNoPositions();
    positionButtonsBelowCard();
  });

  playPauseBtn.addEventListener('click', () => {
    if (isPlaying) {
      musicAudio.pause();
      playPauseBtn.textContent = "▶";
    } else {
      musicAudio.play();
      playPauseBtn.textContent = "❚❚";
    }
    isPlaying = !isPlaying;
  });

  volumeSlider.addEventListener('input', () => {
    musicAudio.volume = volumeSlider.value;
  });

  musicAudio.addEventListener('timeupdate', () => {
    if (musicAudio.duration) {
      const percent = (musicAudio.currentTime / musicAudio.duration) * 100;
      progress.style.width = percent + "%";
      currentTimeEl.textContent = formatTime(musicAudio.currentTime);
      durationEl.textContent = formatTime(musicAudio.duration);
    }
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const duration = musicAudio.duration;
    if (duration) musicAudio.currentTime = (clickX / rect.width) * duration;
  });

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2,'0');
    return `${mins}:${secs}`;
  }

  const images = Array.from({ length: 20 }, (_, i) => `r${i+1}.jpg`);

  function spawnImage() {
    const img = document.createElement("img");
    img.src = images[Math.floor(Math.random() * images.length)];
    img.className = "floating-image";

    const maxLeft = window.innerWidth - 320;
    img.style.left = Math.random() * maxLeft + "px";

    const size = Math.random() * 140 + 180;
    img.style.width = size + "px";

    const tilt = Math.random() * 40 - 20;
    img.style.transform = `rotate(${tilt}deg)`;

    const duration = Math.random() * 4 + 6;
    img.style.animationDuration = duration + "s";

    floatingContainer.appendChild(img);
    setTimeout(() => img.remove(), duration * 1000);
  }
});
</script>
</body>
</html>

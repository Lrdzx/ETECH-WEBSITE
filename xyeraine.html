
<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const questionCard = document.getElementById('questionCard');
const musicPlayer = document.getElementById('musicPlayer');
const playPauseBtn = document.getElementById('playPauseBtn');
const musicAudio = document.getElementById('musicAudio');
const volumeSlider = document.getElementById('volume');
const progressBar = document.getElementById('progressBar');
const progress = document.getElementById('progress');
const floatingContainer = document.getElementById("floatingContainer");
const reactionImg = document.getElementById("reactionImg");

let isPlaying = false;
let floatingInterval = null;

/* ========================= */
/* YES BUTTON (UNCHANGED)   */
/* ========================= */
yesBtn.addEventListener('click',()=>{
  questionCard.style.display='none';
  musicPlayer.style.display='block';
  musicAudio.play();
  isPlaying=true;
  playPauseBtn.textContent='Pause';

  if(!floatingInterval){
    floatingInterval=setInterval(spawnImage,600);
  }
});

/* ========================= */
/* PLAY / PAUSE (UNCHANGED) */
/* ========================= */
playPauseBtn.addEventListener('click',()=>{
  if(isPlaying){ 
    musicAudio.pause(); 
    playPauseBtn.textContent='Play'; 
  }
  else { 
    musicAudio.play(); 
    playPauseBtn.textContent='Pause'; 
  }
  isPlaying=!isPlaying;
});

/* ========================= */
/* VOLUME (UNCHANGED)       */
/* ========================= */
volumeSlider.addEventListener('input',()=>{
  musicAudio.volume=volumeSlider.value;
});

/* ========================= */
/* PROGRESS (UNCHANGED)     */
/* ========================= */
musicAudio.addEventListener('timeupdate',()=>{
  if(musicAudio.duration>0){
    progress.style.width=(musicAudio.currentTime/musicAudio.duration*100)+'%';
  }
});

progressBar.addEventListener('click',e=>{
  const rect=progressBar.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  musicAudio.currentTime=pct*musicAudio.duration;
});

/* ========================= */
/* REACTION IMAGE LOGIC     */
/* ========================= */

let dodgeCount = 0;
let teleportSensitivity = 120; 

noBtn.addEventListener("mouseenter", () => {
  reactionImg.src = "images/sad.png";
});

noBtn.addEventListener("mouseleave", () => {
  reactionImg.src = "images/happy.png";
});

/* ========================= */
/* SMART TELEPORT SYSTEM     */
/* ========================= */

document.addEventListener("mousemove", (e) => {

  const rect = noBtn.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const distance = Math.hypot(
    e.clientX - centerX,
    e.clientY - centerY
  );

  if (distance < teleportSensitivity) {
    dodgeCount++;
    shakeButton();
    setTimeout(() => {
      teleportNoButton();
    }, 120);

    teleportSensitivity += 5;

    if (dodgeCount > 5) {
      reactionImg.src = "images/angry.png";
    }
  }
});

function teleportNoButton() {

  const padding = 20;

  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.position = "fixed";
  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}

/* Small Shake Animation */
function shakeButton(){
  noBtn.style.transition = "transform 0.1s";
  noBtn.style.transform = "translateX(-5px)";
  setTimeout(()=>{
    noBtn.style.transform = "translateX(5px)";
  },50);
  setTimeout(()=>{
    noBtn.style.transform = "translateX(0px)";
  },100);
}

/* ========================= */
/* FLOATING IMAGES (UNCHANGED) */
/* ========================= */

const images=[
"images/img1.png","images/img2.png","images/img3.png",
"images/img4.png","images/img5.png","images/img6.png",
"images/img7.png","images/img8.png","images/img9.png",
"images/img10.png","images/img11.png","images/img12.png",
"images/img13.png","images/img14.png","images/img15.png",
"images/img16.png","images/img17.png","images/img18.png",
"images/img19.png","images/img20.png"
];

function spawnImage(){
  const img=document.createElement("img");
  img.src=images[Math.floor(Math.random()*images.length)];
  img.className="floating-image";

  const maxLeft=window.innerWidth-320;
  img.style.left=Math.random()*maxLeft+"px";

  const size=Math.random()*140+180;
  img.style.width=size+"px";

  const tilt=Math.random()*40-20;
  img.style.transform="rotate("+tilt+"deg)";

  const duration=Math.random()*4+6;
  img.style.animationDuration=duration+"s";

  floatingContainer.appendChild(img);
  setTimeout(()=>img.remove(),duration*1000);
}
</script>

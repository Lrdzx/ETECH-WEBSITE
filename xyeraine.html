<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Interactive</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; }
  html, body { height:100%; width:100%; overflow:hidden; }

  body {
    display:flex; justify-content:center; align-items:center;
    background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 800% 800%;
    animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .overlay { position:absolute; inset:0; }

  .card {
    position:relative; z-index:1;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(25px);
    border-radius:2rem;
    border:1px solid rgba(255,255,255,0.3);
    padding:2rem; text-align:center;
    color:#fff;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: transform 0.3s;
  }
  .card:hover { transform: scale(1.03); }

  h1 { font-size:2.5rem; margin-bottom:0.5rem; text-shadow:0 2px 10px rgba(0,0,0,0.3); }
  p { font-size:1.2rem; margin-bottom:1.5rem; min-height:1.5rem; }

  .buttons { display:flex; justify-content:center; gap:1rem; position:relative; height:60px; }
  button {
    padding:1rem 2rem; border:none; border-radius:1.5rem;
    font-size:1.2rem; font-weight:bold; cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }
  button:hover { transform: scale(1.1); box-shadow:0 10px 20px rgba(236,72,153,0.5);}
  #yesBtn { background:#ec4899; color:#fff;}
  #noBtn { background:#9ca3af; color:#fff; position:absolute; }

  .spotify-card {
    display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;
    background: rgba(0,0,0,0.5); border-radius:1.5rem; padding:1rem;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
  }
  .spotify-card img { width:80px; height:80px; border-radius:1rem; object-fit:cover; transition: transform 0.3s; }
  .spotify-card img:hover { transform: scale(1.05); }
  .song-info { text-align:left; }
  .song-title { font-weight:bold; }
  .song-artist { font-size:0.9rem; opacity:0.8; }

  .player { background: rgba(255,255,255,0.15); backdrop-filter: blur(25px); border-radius:2rem; border:1px solid rgba(255,255,255,0.3); padding:1rem; text-align:center; max-width:350px; margin-top:2rem; box-shadow:0 15px 40px rgba(0,0,0,0.3); }
  .progress-bar { background: rgba(255,255,255,0.2); height: 8px; border-radius:4px; overflow:hidden; cursor:pointer; margin:0.5rem 0; }
  .progress { background:#ec4899; height:100%; width:0%; transition: width 0.1s linear; }
  .volume { display:flex; align-items:center; gap:0.5rem; justify-content:center; margin:0.5rem 0; }

  .heart {
    position:absolute; width:15px; height:15px; background:red; transform:rotate(-45deg);
    animation: floatUp 3s ease forwards; pointer-events:none;
  }
  .heart::before, .heart::after { content:''; position:absolute; width:15px; height:15px; background:red; border-radius:50%; }
  .heart::before { top:-7px; left:0; }
  .heart::after { left:7px; top:0; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) rotate(-45deg);} 100%{opacity:0; transform:translateY(-200px) rotate(-45deg);} }
</style>
</head>
<body>
<div class="overlay"></div>

<div class="card" id="questionCard">
  <div class="spotify-card">
    <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop" alt="Album Cover">
    <div class="song-info">
      <div class="song-title">You Are My Valentine</div>
      <div class="song-artist">Forever Yours</div>
    </div>
  </div>
  <h1>Will you be my Valentine?</h1>
  <p id="dynamicMessage">💕</p>
  <div class="buttons">
    <button id="yesBtn">Yes! 💖</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div class="player" id="musicPlayer" style="display:none;">
  <img id="playerCover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop" style="width:100px;height:100px;border-radius:1rem;object-fit:cover;">
  <div class="song-info">
    <div class="song-title">You Are My Valentine</div>
    <div class="song-artist">Forever Yours</div>
  </div>
  <div class="progress-bar" id="progressBar"><div class="progress" id="progress"></div></div>
  <div class="volume"><label>🔊</label><input type="range" min="0" max="1" step="0.01" id="volume" value="0.7"></div>
  <button id="playPauseBtn">Play</button>
</div>

<audio id="teleportAudio" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>
<audio id="yesAudio" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>
<audio id="musicAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('dynamicMessage');
const questionCard = document.getElementById('questionCard');
const musicPlayer = document.getElementById('musicPlayer');
const playPauseBtn = document.getElementById('playPauseBtn');
const musicAudio = document.getElementById('musicAudio');
const volumeSlider = document.getElementById('volume');
const progressBar = document.getElementById('progressBar');
const progress = document.getElementById('progress');
const teleportAudio = document.getElementById('teleportAudio');
const yesAudio = document.getElementById('yesAudio');

let noAttempts=0, isPlaying=false;

// ======= INITIAL POSITION - YES and NO parallel =====
window.onload = () => {
  const yesRect = yesBtn.getBoundingClientRect();
  const noRect = noBtn.getBoundingClientRect();
  const startTop = yesRect.top;
  const gap = 180; // horizontal gap between yes and no
  noBtn.style.top = startTop + 'px';
  noBtn.style.left = (yesRect.left + gap) + 'px';
};

// ======= Dynamic message =====
function updateMessage() {
  if(noAttempts===0) message.textContent="💕";
  else if(noAttempts<3) message.textContent="Please? 🥺";
  else if(noAttempts<5) message.textContent="Pretty please? 💖";
  else if(noAttempts<8) message.textContent="I'll take that as a yes! 😊";
  else message.textContent="You can't resist forever! 💝";
}

// ======= Teleport / run away logic (fast escape!) =====
const PADDING = 20;   
const MIN_DISTANCE = 120; 
const MAX_SHIFT = 350;   // much bigger to make it escape faster

function teleportNoButton() {
  const rect = noBtn.getBoundingClientRect();
  const btnX = rect.left;
  const btnY = rect.top;

  const mouseX = lastMouse.x;
  const mouseY = lastMouse.y;

  // Direction away from mouse
  let dx = btnX - mouseX;
  let dy = btnY - mouseY;
  const distance = Math.hypot(dx, dy) || 1;

  // Farther movement when mouse is close
  let moveMultiplier = Math.min(MAX_SHIFT, (MIN_DISTANCE / distance) * MAX_SHIFT);
  let moveX = (dx / distance) * moveMultiplier;
  let moveY = (dy / distance) * moveMultiplier;

  let newX = btnX + moveX;
  let newY = btnY + moveY;

  // keep inside screen
  const maxX = window.innerWidth - noBtn.offsetWidth - PADDING;
  const maxY = window.innerHeight - noBtn.offsetHeight - PADDING;
  newX = Math.min(maxX, Math.max(PADDING, newX));
  newY = Math.min(maxY, Math.max(PADDING, newY));

  // if button is too close to edge, reset to center
  if(newX <= PADDING || newX >= maxX || newY <= PADDING || newY >= maxY){
    newX = (window.innerWidth - noBtn.offsetWidth)/2;
    newY = (window.innerHeight - noBtn.offsetHeight)/2;
  }

  noBtn.style.left = newX+'px';
  noBtn.style.top = newY+'px';

  noAttempts++;
  updateMessage();
  teleportAudio.currentTime=0; teleportAudio.play();
  createHeart(newX + noBtn.offsetWidth/2, newY + noBtn.offsetHeight/2);
}

// ======= Floating hearts =====
function createHeart(x,y){
  const heart=document.createElement('div');
  heart.className='heart';
  heart.style.left=x+'px';
  heart.style.top=y+'px';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),3000);
}

// ======= Track last mouse =====
let lastMouse = {x:0,y:0};
document.addEventListener('mousemove', e => {
  lastMouse.x = e.clientX;
  lastMouse.y = e.clientY;

  const rect=noBtn.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const distance = Math.hypot(e.clientX-cx,e.clientY-cy);

  if(distance < MIN_DISTANCE){
    teleportNoButton();
  }
});

// ======= Yes button =====
yesBtn.addEventListener('click',()=>{
  questionCard.style.display='none';
  yesAudio.currentTime=0; yesAudio.play();
  musicPlayer.style.display='block';
  musicAudio.currentTime=0; musicAudio.play();
  isPlaying=true; playPauseBtn.textContent='Pause';
});

// ======= Play/pause =====
playPauseBtn.addEventListener('click',()=>{
  if(isPlaying){ musicAudio.pause(); playPauseBtn.textContent='Play'; }
  else { musicAudio.play(); playPauseBtn.textContent='Pause'; }
  isPlaying=!isPlaying;
});

// ======= Volume =====
volumeSlider.addEventListener('input',()=>{ musicAudio.volume=volumeSlider.value; });

// ======= Progress bar =====
musicAudio.addEventListener('timeupdate',()=>{
  if(musicAudio.duration>0){
    progress.style.width=(musicAudio.currentTime/musicAudio.duration*100)+'%';
  }
});
progressBar.addEventListener('click',e=>{
  const rect=progressBar.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  musicAudio.currentTime=pct*musicAudio.duration;
});
</script>
</body>
</html>

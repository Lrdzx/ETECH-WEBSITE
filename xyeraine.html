<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Interactive</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; }
  html, body { height:100%; width:100%; overflow:hidden; }

  body {
    display:flex; justify-content:center; align-items:center;
    background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 800% 800%;
    animation: gradientBG 15s ease infinite;
    position:relative;
  }
  @keyframes gradientBG {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .card {
    position:relative; z-index:1;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(25px);
    border-radius:2rem;
    border:1px solid rgba(255,255,255,0.3);
    padding:2rem; text-align:center;
    color:#fff;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: transform 0.3s;
  }
  h1 { font-size:2rem; margin-bottom:0.5rem; text-shadow:0 2px 10px rgba(0,0,0,0.3); }
  p { font-size:1.2rem; margin-bottom:1.5rem; min-height:1.5rem; }

  .buttons {
    display:flex; justify-content:center; align-items:center; gap:2rem; position:relative; height:60px;
  }

  button {
    padding:1rem 2rem; border:none; border-radius:1.5rem;
    font-size:1.2rem; font-weight:bold; cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }
  button:hover { transform: scale(1.1); box-shadow:0 10px 20px rgba(236,72,153,0.5);}
  #yesBtn { background:#ec4899; color:#fff;}
  #noBtn { background:#9ca3af; color:#fff; position:absolute; top:0; left:0; }

  /* Heart effect */
  .heart {
    position:absolute; width:15px; height:15px; background:red; transform:rotate(-45deg);
    animation: floatUp 3s ease forwards; pointer-events:none;
  }
  .heart::before, .heart::after { content:''; position:absolute; width:15px; height:15px; background:red; border-radius:50%; }
  .heart::before { top:-7px; left:0; }
  .heart::after { left:7px; top:0; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) rotate(-45deg);} 100%{opacity:0; transform:translateY(-200px) rotate(-45deg);} }
</style>
</head>
<body>

<div class="card" id="questionCard">
  <h1>Will you be my Valentine?</h1>
  <p id="dynamicMessage">💕</p>
  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No</button>
  </div>
</div>

<audio id="teleportAudio" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>
<audio id="yesAudio" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const message = document.getElementById('dynamicMessage');
  const teleportAudio = document.getElementById('teleportAudio');
  const yesAudio = document.getElementById('yesAudio');

  let noAttempts = 0;

  // Initialize noBtn position next to yesBtn
  function initButtonPosition() {
    const yesRect = yesBtn.getBoundingClientRect();
    noBtn.style.left = (yesRect.right - yesRect.left + 20) + 'px';
    noBtn.style.top = '0px';
  }

  window.addEventListener('resize', initButtonPosition);
  window.addEventListener('load', initButtonPosition);

  function updateMessage() {
    if(noAttempts===0) message.textContent="💕";
    else if(noAttempts<3) message.textContent="Please? 🥺";
    else if(noAttempts<5) message.textContent="Pretty please? 💖";
    else if(noAttempts<8) message.textContent="I'll take that as a yes! 😊";
    else message.textContent="You can't resist forever! 💝";
  }

  function teleportNoButton() {
    const padding=20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;
    const x = Math.random() * (maxX - padding) + padding;
    const y = Math.random() * (maxY - padding) + padding;

    noBtn.style.transition = 'all 0.3s ease';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    noAttempts++;
    updateMessage();

    teleportAudio.currentTime = 0;
    teleportAudio.play();

    createHeart(x + noBtn.offsetWidth/2, y + noBtn.offsetHeight/2);
  }

  function createHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),3000);
  }

  document.addEventListener('mousemove', e => {
    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    if(Math.hypot(e.clientX - cx, e.clientY - cy) < 120) {
      teleportNoButton();
    }
  });

  yesBtn.addEventListener('click', () => {
    alert('Yay! You clicked yes! 💖');
    yesAudio.currentTime = 0;
    yesAudio.play();
  });
</script>
</body>
</html>

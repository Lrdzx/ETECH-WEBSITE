<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
font-family:'Inter','Roboto',Arial,sans-serif;
background:#000; color:white;
min-height:100vh; overflow-x:hidden;
padding-top:80px;
}

/* NAVBAR */
nav {
width:100%; background:#000000e6;
position:fixed; top:0; left:0; z-index:900;
border-bottom:1px solid white;
display:flex; justify-content:space-between; align-items:center;
height:80px; padding:0 2rem;
}
.logo { display:flex; align-items:center; gap:10px; }
.logo img { height:50px; }

/* HAMBURGER */
.hamburger {
font-size:1rem; color:white; cursor:pointer;
background:#222; border:none; outline:none;
display:flex; align-items:center; gap:8px; justify-content:center;
padding:10px 16px; border-radius:8px; z-index:1001;
}
.hamburger i { font-size:1.4rem; color:#00bfff; }
.hamburger span { font-weight:600; letter-spacing:1px; }
.hamburger:hover { background:#444; }

/* SIDE MENU */
.side-menu {
position:fixed; top:0; right:-250px;
width:250px; height:100%; background:#111;
display:flex; flex-direction:column; padding:2rem;
transition:right 0.3s ease; z-index:1000;
overflow-y:auto;
}
.side-menu.active { right:0; }
.side-menu a {
text-decoration:none; color:white; font-weight:500;
padding:12px 18px; border-radius:8px; margin:5px 0;
display:flex; align-items:center; gap:8px;
background:linear-gradient(135deg,#232526,#414345);
transition:all 0.3s ease;
}
.side-menu a:hover {
background:linear-gradient(135deg,#00bfff,#87cefa);
color:#222; transform:scale(1.05);
}

/* START MENU & BUTTONS */
.start-menu {
padding:4rem 10%; display:flex; flex-direction:column;
align-items:center; gap:1rem; text-align:center;
}
.start-buttons {
display:flex; flex-wrap: wrap; gap:10px; justify-content:center;
}
.start-btn, .select-btn, .select-dept-btn {
margin-top:1rem; padding:10px 20px; border:none;
border-radius:8px; background:#00bfff; color:#000;
font-weight:700; cursor:pointer; transition:0.3s;
}
.start-btn:hover, .select-btn:hover, .select-dept-btn:hover { background:#87cefa; }

/* DEPARTMENT SIDE MENU FROM LEFT BELOW NAVBAR */
.dept-popup {
  position: fixed;
  top: 80px;           /* leave space for navbar height */
  left: -300px;        /* hidden off-screen initially */
  width: 300px;
  height: calc(100% - 80px); /* full height minus navbar */
  background: #111;
  padding: 2rem 1rem;
  border-right: 2px solid #00bfff;
  display: flex;
  flex-direction: column;
  transition: left 0.3s ease;
  z-index: 1500;
  overflow-y: auto;
}

/* hide scrollbar */
.dept-popup::-webkit-scrollbar { display: none; }
.dept-popup { -ms-overflow-style: none; scrollbar-width: none; }

.dept-popup.active { left: 0; }

.dept-popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.dept-popup-header h3 { font-size: 1.2rem; color:white; }

.dept-popup-body { display: flex; flex-direction: column; gap: 0.5rem; }

.start-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center; /* center buttons horizontally */
  gap: 10px;
  margin-top: 2rem; /* space from top or other elements */
}


/* DEPARTMENT CARDS */
.dept-card {
background:rgba(255,255,255,0.05);
border:1px solid #555; border-radius:10px; padding:0.8rem;
display:flex; align-items:center; cursor:pointer; transition:all 0.3s ease;
}
.dept-card:hover { background:rgba(0,191,255,0.1); border-color:#00bfff; }
.dept-card input { display:none; }
.dept-card.selected { background:rgba(0,191,255,0.2); border-color:#00bfff; }

/* QUIZ */
.quiz-container {
padding:4rem 10%; display:flex; flex-direction:column; align-items:center; gap:2rem;
}
.question-card {
background:rgba(255,255,255,0.05);
border:1px solid #ffffff33;
border-radius:12px; padding:2rem;
max-width:700px; width:100%; text-align:center;
box-shadow:0 4px 24px rgba(0,191,255,0.15);
opacity:0; transform:translateY(20px);
transition:opacity 0.6s ease-out, transform 0.6s ease-out;
}
.question-card.visible { opacity:1; transform:translateY(0); }
.question-card img {
max-width:250px; width:100%; margin-bottom:1rem;
border-radius:10px; box-shadow:0 4px 16px rgba(0,191,255,0.2);
}
.question-card input {
padding:10px; width:100%; max-width:400px;
border:none; border-radius:8px; outline:none;
margin-top:1rem;
}
.question-card button {
margin-top:1rem; padding:10px 20px; border:none; border-radius:8px;
background:#00bfff; color:#000; font-weight:700; cursor:pointer;
}
.page-wrapper {
  transition: margin-left 0.3s ease;
}
.page-wrapper.shifted {
  margin-left: 300px; /* same width as dept-popup */
}
.feedback { margin-top:1rem; font-size:1rem; font-weight:600; text-align:left; }
.correct { color:#32cd32; }
.incorrect { color:#ff4444; }

</style>

<script>
const hamburger = document.getElementById("hamburger");
const sideMenu = document.getElementById("sideMenu");
hamburger.addEventListener("click", () => { sideMenu.classList.toggle("active"); });

// Department popup
const deptPopup = document.getElementById('deptPopup');
const deptToggleBtn = document.getElementById('deptToggleBtn');

// Open side menu
deptToggleBtn.addEventListener('click', () => {
  deptPopup.classList.add('active');
  document.getElementById('pageWrapper').classList.add('shifted');
});


// Close when clicking outside
const startButtonsContainer = document.querySelector('.start-buttons');

document.addEventListener('click', (e) => {
  if (
    !deptPopup.contains(e.target) &&
    !deptToggleBtn.contains(e.target) &&
    !startButtonsContainer.contains(e.target) // exclude start buttons
  ) {
    deptPopup.classList.remove('active');
    document.getElementById('pageWrapper').classList.remove('shifted');
  }
});
// Department card selection
const cards = deptPopup.querySelectorAll(".dept-card");
cards.forEach(card => {
const checkbox = card.querySelector("input");
card.addEventListener("click", (e) => {
if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL'){
checkbox.checked = !checkbox.checked;
}
card.classList.toggle("selected", checkbox.checked);
});
});

// Buttons
const selectAllBtn = document.getElementById("selectAllBtn");
const clearBtn = document.getElementById("clearBtn");
const randomBtn = document.getElementById("randomBtn");
const startBtn = document.getElementById("startBtn");

selectAllBtn.addEventListener("click", () => {
cards.forEach(card => { card.querySelector("input").checked = true; card.classList.add("selected"); });
});
clearBtn.addEventListener("click", () => {
cards.forEach(card => { card.querySelector("input").checked = false; card.classList.remove("selected"); });
});
randomBtn.addEventListener("click", () => {
const shuffled = [...cards].sort(() => 0.5 - Math.random());
const halfCount = Math.ceil(cards.length / 2);
cards.forEach(card => { card.querySelector("input").checked = false; card.classList.remove("selected"); });
shuffled.slice(0, halfCount).forEach(card => { card.querySelector("input").checked = true; card.classList.add("selected"); });
});

let quizData = [];
let currentIndex = 0;
function shuffleArray(array) {
for(let i=array.length-1;i>0;i--){
const j = Math.floor(Math.random()*(i+1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

].filter(q=>selected.includes(q.acronym));
quizData = shuffleArray(quizData);
currentIndex = 0;
deptPopup.classList.remove('active');
document.getElementById("quizContainer").style.display = "flex";
renderQuizCard();
});

function renderQuizCard(){
const card = document.getElementById("quizCard");
card.innerHTML = `
<img id="acronymImage" src="" alt="Acronym Image">
<h2>Fill in the details</h2>
<input type="text" id="acronymInput" placeholder="Acronym...">
<input type="text" id="meaningInput" placeholder="Meaning...">
<input type="text" id="secretaryInput" placeholder="Secretary...">
<input type="text" id="electedInput" placeholder="Elected (MM/DD/YYYY)...">
<button id="submitBtn">Submit</button>
<p class="feedback" id="feedback"></p>
`;
acronymImage = document.getElementById("acronymImage");
acronymInput = document.getElementById("acronymInput");
meaningInput = document.getElementById("meaningInput");
secretaryInput = document.getElementById("secretaryInput");
electedInput = document.getElementById("electedInput");
feedback = document.getElementById("feedback");
document.getElementById("submitBtn").addEventListener("click", checkAnswer);
loadQuestion();
}

function loadQuestion() {
const q = quizData[currentIndex];
acronymImage.src = q.img;
acronymInput.value = "";
meaningInput.value = "";
secretaryInput.value = "";
electedInput.value = "";
feedback.textContent = "";
const quizCard = document.getElementById("quizCard");
quizCard.classList.remove("visible");
setTimeout(()=>quizCard.classList.add("visible"),100);
}

function checkAnswer() {
const q = quizData[currentIndex];
let result = "";
result += acronymInput.value.trim().toLowerCase()===q.acronym.toLowerCase() ? `✅ Acronym correct! (${q.acronym})<br>` : `❌ Acronym wrong. Correct: ${q.acronym}<br>`;
result += meaningInput.value.trim().toLowerCase()===q.meaning.toLowerCase() ? `✅ Meaning correct! (${q.meaning})<br>` : `❌ Meaning wrong. Correct: ${q.meaning}<br>`;
result += secretaryInput.value.trim().toLowerCase()===q.secretary.toLowerCase() ? `✅ Secretary correct! (${q.secretary})<br>` : `❌ Secretary wrong. Correct: ${q.secretary}<br>`;
result += electedInput.value.trim()===q.elected ? `✅ Elected correct! (${q.elected})<br>` : `❌ Elected wrong. Correct: ${q.elected}<br>`;
feedback.innerHTML = result;

setTimeout(()=>{
currentIndex++;
if(currentIndex<quizData.length){ loadQuestion(); }
else {
document.getElementById("quizCard").innerHTML = `
<h2>🎉 Quiz Complete!</h2>
<p class="feedback correct">Great job finishing all questions!</p>
<button onclick="restartQuiz()">Retake Quiz</button>
`;
}
},3000);
}

function restartQuiz(){
currentIndex=0;
document.getElementById("quizContainer").style.display="none";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boolean Operators</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
/* ===== RESET ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter','Roboto',Arial,sans-serif;
  min-height: 100vh;
  padding-top: 80px;
  color: white;
  background: url('bgi.jfif') no-repeat center center fixed;
  background-size: cover;
}

/* ===== NAVBAR ===== */
nav {
  width: 100%;
  background: #000000e6;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 900;
  border-bottom: 1px solid white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 80px;
  padding: 0 2rem;
  transition: top 0.3s;
}

.logo { display: flex; gap: 10px; align-items: center; }
.logo img { height: 50px; }

/* ===== MENU BUTTON ===== */
.hamburger {
  font-size: 1rem;
  color: white;
  cursor: pointer;
  background: #222;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hamburger i { color: #00bfff; font-size: 1.4rem; }

/* ===== SIDE MENU ===== */
.side-menu {
  position: fixed;
  top: 0;
  right: -250px;
  width: 250px;
  height: 100%;
  background: #111;
  padding: 2rem;
  transition: right 0.3s ease;
  z-index: 1000;
}
.side-menu.active { right: 0; }

.side-menu a {
  display: flex;
  align-items: center;
  gap: 8px;
  color: white;
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 8px;
  margin: 6px 0;
  background: linear-gradient(135deg,#232526,#414345);
}
.side-menu a:hover {
  background: linear-gradient(135deg,#00bfff,#87cefa);
  color: #222;
}

/* ===== XYERAINE BUTTON ===== */
.xyeraine-btn {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #ff4da6, #ff99cc) !important;
  font-weight: 700;
  box-shadow: 0 0 15px rgba(255,105,180,0.6);
}

.xyeraine-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(255,20,147,0.9);
}

.xyeraine-btn::before,
.xyeraine-btn::after {
  content: "💖";
  position: absolute;
  font-size: 18px;
  opacity: 0;
  animation: floatHearts 2s infinite ease-in-out;
}

.xyeraine-btn::before { left: 12px; bottom: 8px; }
.xyeraine-btn::after { right: 12px; bottom: 8px; animation-delay: 1s; }

.xyeraine-btn:hover::before,
.xyeraine-btn:hover::after { opacity: 1; }

@keyframes floatHearts {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-40px); opacity: 0; }
}

/* ===== OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: 0.3s;
  z-index: 999;
}
.overlay.active { opacity: 1; visibility: visible; }

/* ===== HERO ===== */
.hero {
  height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}
.hero video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) brightness(0.5);
  z-index: -1;
}
.hero-content h1 { font-size: 3rem; }
.hero-content p { color: #00bfff; letter-spacing: 2px; }

/* ===== SECTIONS ===== */
.sections {
  padding: 4rem 10%;
  display: flex;
  flex-direction: column;
  gap: 4rem;
}
.section {
  display: flex;
  gap: 2rem;
  background: rgba(255,255,255,0.05);
  padding: 2rem;
  border-radius: 10px;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.6s;
}
.section.visible {
  opacity: 1;
  transform: translateY(0);
}
.section img {
  width: 300px;
  border-radius: 10px;
}
.section:nth-child(even) { flex-direction: row-reverse; }
</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="deped.png">
    <img src="logo.png">
  </div>
  <button class="hamburger" id="hamburger">
    <i class="fa-solid fa-bars"></i> Menu
  </button>
</nav>

<div class="side-menu" id="sideMenu">
  <a href="index.html">Home</a>
  <a href="and.html">AND</a>
  <a href="or.html">OR</a>
  <a href="not.html">NOT</a>
  <a href="list.html">List</a>
  <a href="xyeraine.html" class="xyeraine-btn">Xyeraine</a>
</div>

<div class="overlay" id="overlay"></div>

<section class="hero">
  <video autoplay muted loop>
    <source src="tech.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <p>EMPOWERMENT TECHNOLOGY</p>
    <h1>BOOLEAN OPERATORS</h1>
  </div>
</section>

<div class="sections">
  <div class="section">
    <img src="bool.png">
    <div>
      <h2>What is Boolean Operator?</h2>
      <p>Boolean operators combine search terms using AND, OR, and NOT.</p>
    </div>
  </div>
</div>

<script>
/* FADE IN */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("visible");
    }
  });
});
document.querySelectorAll(".section").forEach(s=>observer.observe(s));

/* MENU */
const hamburger = document.getElementById("hamburger");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");

hamburger.onclick = ()=>{
  sideMenu.classList.toggle("active");
  overlay.classList.toggle("active");
  hamburger.querySelector("i").classList.toggle("fa-bars");
  hamburger.querySelector("i").classList.toggle("fa-xmark");
};

overlay.onclick = ()=>{
  sideMenu.classList.remove("active");
  overlay.classList.remove("active");
};

/* NAVBAR SCROLL */
let lastY = window.scrollY;
window.addEventListener("scroll", ()=>{
  const nav = document.querySelector("nav");
  nav.style.top = window.scrollY > lastY ? "-80px" : "0";
  lastY = window.scrollY;
});
</script>

</body>
</html>
